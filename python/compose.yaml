name: stilowo-desk

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: stilowo
      POSTGRES_PASSWORD: stilowo
      POSTGRES_DB: stilowo
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stilowo -d stilowo"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - stilowo_pg:/var/lib/postgresql/data

volumes:
  stilowo_pg:
