name: stilowo-desk

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: stilowo
      POSTGRES_PASSWORD: stilowo
      POSTGRES_DB: stilowo
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stilowo -d stilowo"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - stilowo_pg:/var/lib/postgresql/data

  desk:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      STILOWO_DATABASE_URL: postgresql+psycopg://stilowo:stilowo@db:5432/stilowo
    env_file:
      - path: ../server/.env
        required: false
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ../server/data:/opt/stilowo/server/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=2)"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 8s

volumes:
  stilowo_pg:
