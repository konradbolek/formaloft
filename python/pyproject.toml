[project]
name = "stilowo-desk"
version = "0.1.0"
description = "Pulpit warsztatu Stilowo. Pierwszy krok Pythona na danych z kalkulatora."
requires-python = ">=3.9"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn==0.32.1",
  "pydantic==2.10.4",
  "sqlalchemy==2.0.36",
  "alembic==1.14.0",
  "psycopg[binary]==3.2.13",
  "reportlab==4.2.5",
  "openai==1.55.3",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==8.3.4",
  "pypdf==5.1.0",
  "ruff==0.8.6",
]

[tool.ruff]
target-version = "py39"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E9", "F"]

[tool.setuptools.package-data]
stilowo_desk = ["fonts/*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
